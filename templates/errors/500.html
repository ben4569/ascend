
{% extends "base.html" %}

{% block title %}
Something Went Wrong — Ascend
{% endblock %}


{% block content %}

<section class="error-page">

    <p class="eyebrow">
        ERROR 500
    </p>

    <h1>
        Something went wrong.
    </h1>

    <p>
        We couldn't complete that request.
        Please try again.
    </p>

    <a
        href="{{ url_for('index') }}"
        class="button button-primary"
    >
        Return Home
    </a>

</section>

{% endblock %}
