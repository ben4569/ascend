
{% extends "base.html" %}

{% block title %}
Page Not Found — Ascend
{% endblock %}


{% block content %}

<section class="error-page">

    <p class="eyebrow">
        ERROR 404
    </p>

    <h1>
        Page not found.
    </h1>

    <p>
        The page you're looking for doesn't exist.
    </p>

    <a
        href="{{ url_for('index') }}"
        class="button button-primary"
    >
        Return Home
    </a>

</section>

{% endblock %}
